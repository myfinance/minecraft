apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.minecraft.app.name }}
  labels:
    app: {{ .Values.minecraft.app.name }}
spec:
  type: {{ .Values.minecraft.service.type | default "LoadBalancer" }}
  ports:
    - name: minecraft
      port: {{ .Values.minecraft.service.port | default 25565 }}
      targetPort: 25565
      protocol: TCP
  selector:
    app: {{ .Values.minecraft.app.name }}
